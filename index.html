<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮肤科病房护士排班分析</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-hospital"></i> 皮肤科病房护士排班分析 </h1>
            <div class="dataset-toggle">
                <button id="datasetToggle" class="toggle-button">
                    <i class="fas fa-virus"></i>
                    <span id="datasetLabel">不包含疫情数据 (2014-04 至 2020-01)</span>
                </button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="overview">
                <i class="fas fa-chart-bar"></i> 总览
            </button>
            <button class="tab-button" data-tab="monthly">
                <i class="fas fa-calendar"></i> 月度统计
            </button>
            <button class="tab-button" data-tab="person">
                <i class="fas fa-user"></i> 个人详情
            </button>
        </nav>

        <!-- Monthly Statistics Tab -->
        <div id="monthly" class="tab-content">
            <div class="controls">
                <div class="control-section">
                    <label>选择年份:</label>
                    <div class="button-group" id="yearButtons"></div>
                </div>
                <div class="control-section">
                    <label>选择月份:</label>
                    <div class="button-group" id="monthButtons"></div>
                </div>
            </div>

            <div class="monthly-summary" id="monthlySummary"></div>
            <div class="monthly-stats" id="monthlyStats"></div>
        </div>

        <!-- Person Details Tab -->
        <div id="person" class="tab-content">
            <div class="controls">
                <div class="control-section">
                    <label>选择护士:</label>
                    <div class="button-group" id="personButtons"></div>
                </div>
            </div>

            <div class="person-overview" id="personOverview"></div>
            
            <!-- Charts Section -->
            <div class="person-charts" id="personCharts">
                <h3><i class="fas fa-chart-line"></i> 数据趋势图表</h3>
                
                <!-- 存假天数图表组 -->
                <div class="chart-group">
                    <h4 class="chart-group-title"><i class="fas fa-calendar-minus"></i> 存假天数分析</h4>
                    <div class="chart-container">
                        <h5>月度存假天数</h5>
                        <canvas id="monthlySavedRestChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h5>累计存假天数</h5>
                        <canvas id="accumulatedSavedRestChart"></canvas>
                    </div>
                </div>
                
                <!-- 有效工作日图表组 -->
                <div class="chart-group">
                    <h4 class="chart-group-title"><i class="fas fa-briefcase"></i> 有效工作日分析</h4>
                    <div class="chart-container">
                        <h5>月度有效工作日</h5>
                        <canvas id="monthlyWorkedDaysChart"></canvas>
                    </div>
                </div>
                
                <!-- 有效休息日图表组 -->
                <div class="chart-group">
                    <h4 class="chart-group-title"><i class="fas fa-bed"></i> 有效休息日分析</h4>
                    <div class="chart-container">
                        <h5>月度有效休息日</h5>
                        <canvas id="monthlyRestDaysChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="person-monthly" id="personMonthly"></div>
        </div>

        <!-- Overview Tab -->
        <div id="overview" class="tab-content active">
            <div class="overview-sections">
                
                <!-- 存假天数排名表 -->
                <div class="overview-section">
                    <h3><i class="fas fa-user-nurse"></i> 护士存假天数排名</h3>
                    <div id="calculationExplanationContainer"></div>
                    <div class="ranking-table" id="savedDaysRankingTable"></div>
                </div>
                
                <!-- 累计存假天数趋势对比图表组 -->
                <div class="overview-section">
                    <h3><i class="fas fa-chart-line"></i> 累计存假天数趋势对比</h3>
                    
                    <!-- 第1组：马磊 vs 张雪野 -->
                    <div class="chart-group">
                        <h4 class="chart-group-title">第1组：马磊 vs 张雪野</h4>
                        <div class="chart-container">
                            <canvas id="cumulativeChart1"></canvas>
                        </div>
                    </div>
                    
                    <!-- 第2组：付伟 vs 赵蕊 -->
                    <div class="chart-group">
                        <h4 class="chart-group-title">第2组：付伟 vs 赵蕊</h4>
                        <div class="chart-container">
                            <canvas id="cumulativeChart2"></canvas>
                        </div>
                    </div>
                    
                    <!-- 第3组：徐莹 vs 荆小舟 -->
                    <div class="chart-group">
                        <h4 class="chart-group-title">第3组：徐莹 vs 荆小舟</h4>
                        <div class="chart-container">
                            <canvas id="cumulativeChart3"></canvas>
                        </div>
                    </div>
                    
                    <!-- 第4组：付巍巍 vs 邹婷 -->
                    <div class="chart-group">
                        <h4 class="chart-group-title">第4组：付巍巍 vs 邹婷</h4>
                        <div class="chart-container">
                            <canvas id="cumulativeChart4"></canvas>
                        </div>
                    </div>
                    
                    <!-- 第5组：尤嘉 vs 王鑫 -->
                    <div class="chart-group">
                        <h4 class="chart-group-title">第5组：尤嘉 vs 王鑫</h4>
                        <div class="chart-container">
                            <canvas id="cumulativeChart5"></canvas>
                        </div>
                    </div>
                    
                    <!-- 第6组：钱璐 陈平 vs 李如心 -->
                    <div class="chart-group">
                        <h4 class="chart-group-title">第6组：钱璐 陈平 vs 李如心</h4>
                        <div class="chart-container">
                            <canvas id="cumulativeChart6"></canvas>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>正在加载医院排班数据...</p>
    </div>

    <!-- 模块化JavaScript文件 -->
    <script src="src/utils/calculation-explanation-loader.js"></script>
    <script src="src/utils/maintenance-manager.js"></script>
    <!-- 数据处理器模块 -->
    <script src="src/services/data-loader.js"></script>
    <script src="src/services/data-adjuster.js"></script>
    <script src="src/services/monthly-processor.js"></script>
    <script src="src/services/summary-generator.js"></script>
    <script src="src/services/data-processor.js"></script>
    <!-- UI管理模块 -->
        <script src="src/managers/tab-manager.js"></script>
        <script src="src/managers/selection-manager.js"></script>
        <script src="src/managers/monthly-display-manager.js"></script>
        <script src="src/managers/calendar-display-manager.js"></script>
        <script src="src/managers/person-display-manager.js"></script>
        <script src="src/managers/chart-display-manager.js"></script>
        <script src="src/managers/ranking-display-manager.js"></script>
        <script src="src/managers/display-manager.js"></script>
        <script src="src/managers/chart-manager.js"></script>
    <script src="src/managers/ui-controller.js"></script>
    <!-- 其他模块 -->
    <script src="src/hospital-shift-analyzer.js"></script>
</body>
</html>
